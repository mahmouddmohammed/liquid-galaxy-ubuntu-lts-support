# See: man logrotate

# Rotate log files weekly
weekly

# Keep 4 weeks of backlogs
rotate 4

# Create new (empty) log file after rotating the old one
create

# Compress rotated log files using gzip
compress

# Delay compression by one rotation cycle
# (allows rsyslog to finish writing before the file is compressed)
delaycompress

# Add date-based extension to rotated files (e.g. syslog-20260619)
dateext

# Use date+time for uniqueness when rotating multiple times per day
dateformat -%Y%m%d

# Do not error if log file is missing
missingok

# Do not rotate empty log files
notifempty

# Packages drop their own log rotation config here
include /etc/logrotate.d

# Login records — not owned by any package, rotated here
/var/log/wtmp {
    missingok
    monthly
    create 0664 root utmp
    rotate 1
    nocompress
}

/var/log/btmp {
    missingok
    monthly
    create 0660 root utmp
    rotate 1
    nocompress
}

# system-specific logs may be added here