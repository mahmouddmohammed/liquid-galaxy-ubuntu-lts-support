# In systemd:
#   - galaxy-ok signal   -> After=galaxy.service + Requires=galaxy.service
#   - drm-device-added   -> After=systemd-udev-settle.service (udev settles all devices)
#   - udev-fallback-graphics -> no equivalent needed; gdm3 handles display detection natively
#   - runlevel [!06]     -> handled by WantedBy=graphical.target in galaxy.service
#   - stop on runlevel [016] -> handled by Conflicts=rescue.target shutdown.target

[Unit]
After=galaxy.service systemd-udev-settle.service
Wants=galaxy.service 
# Wants Instead of Requires because if something is not working properly and galaxy.service is hanging so display servies will not run and you will go to TTY and display services is down
