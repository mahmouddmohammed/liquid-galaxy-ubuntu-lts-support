#################
#### MODULES ####
#################

# Provides support for local system logging (e.g. via logger command)
module(load="imuxsock")

# Provides kernel logging support
module(load="imklog")

# Provides --MARK-- message capability (disabled)
#module(load="immark" interval="3600")

# Provides UDP syslog reception (disabled)
#module(load="imudp")
#input(type="imudp" port="514")

# Provides TCP syslog reception (disabled)
#module(load="imtcp")
#input(type="imtcp" port="514")


###########################
#### GLOBAL DIRECTIVES ####
###########################

# Set default umask for log files
global(umask="0022")

# Set default file ownership and permissions for omfile output
module(load="builtin:omfile"
    fileOwner="syslog"
    fileGroup="adm"
    fileCreateMode="0640"
    dirCreateMode="0755"
)

# Drop privileges after startup
$PrivDropToUser syslog
$PrivDropToGroup syslog


#####################
#### LOG RULES   ####
#####################

# Log all messages to /var/log/syslog (except auth)
*.*;auth,authpriv.none          /var/log/syslog

# Auth and sudo logs
auth,authpriv.*                 /var/log/auth.log

# Kernel messages
kern.*                          /var/log/kern.log

# Cron jobs
cron.*                          /var/log/cron.log

# Mail system
mail.*                          /var/log/mail.log

# Emergency messages to all logged-in users
*.emerg                         :omusrmsg:*


###########################
#### INCLUDE DROP-INS  ####
###########################

# Packages and custom configs drop rules here
include(file="/etc/rsyslog.d/*.conf" mode="optional")