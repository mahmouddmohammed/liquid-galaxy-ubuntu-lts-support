#!/usr/sbin/nft -f
#
# Ubuntu 26.04 uses nftables natively. Load with:
#   nft -f /etc/nftables.conf
# To persist across reboots, ensure nftables.service is enabled:
#   systemctl enable nftables
#
# NOTE: Replace <WAN_IFACE> with your actual WAN interface name (e.g. enp3s0, eno1).
#       Run: ip link show    — to find your interface names before applying.
#

flush ruleset

#---------------------------------------------------------------
# NAT table
# Masquerading is disabled by default (commented out).
# To enable: uncomment the postrouting rule and replace <WAN_IFACE>
# Also enable IP forwarding: net.ipv4.ip_forward=1 in /etc/sysctl.d/
#---------------------------------------------------------------
table ip nat {
    chain prerouting {
        type nat hook prerouting priority dstnat; policy accept;
    }

    chain postrouting {
        type nat hook postrouting priority srcnat; policy accept;

        # Masquerade LAN traffic going out through the WAN interface
        # Uncomment and set correct interface name to enable:
        # oifname "<WAN_IFACE>" ip saddr 10.3.3.0/24 masquerade
    }
}

#---------------------------------------------------------------
# Filter table
#---------------------------------------------------------------
table ip filter {

    chain input {
        type filter hook input priority filter; policy drop;

        # Allow loopback
        iifname "lo" accept

        # Allow established and related connections
        ct state established,related accept

        # Allow ICMP (ping)
        ip protocol icmp accept

        # SSH from anywhere
        tcp dport 22 accept

        # SNMP (snmpd and squid SNMP) from internal network only
        ip saddr 10.42.0.0/16 udp dport 161 accept
        ip saddr 10.42.0.0/16 udp dport 3401 accept

        # Apache/Squid stats UI (TCP 81, 8111, 8112 — UDP 8113)
        tcp dport { 81, 8111, 8112 } accept
        udp dport 8113 accept

        # Squid peer traffic from LG cluster (TCP and UDP: 80, 3128, 3130)
        ip saddr 10.42.42.0/24 tcp dport { 80, 3128, 3130 } accept
        ip saddr 10.42.42.0/24 udp dport { 80, 3128, 3130 } accept

        # Portable Server from LG cluster
        ip saddr 10.42.42.0/24 tcp dport 9335 accept

        # UDP broadcast within LG cluster subnet
        ip saddr 10.42.42.0/24 ip daddr 10.42.42.255 ip protocol udp accept

        # DNS, TFTP, DHCP on LAN interface (disabled — uncomment and set <LAN_IFACE> to enable)
        # iifname "<LAN_IFACE>" udp dport { 53, 67, 68, 69 } accept

        # Optional: log dropped input packets before default drop
        # log prefix "nft-drop-input: " level info

        # Default: drop everything else (set by policy drop above)
    }

    chain forward {
        type filter hook forward priority filter; policy drop;

        # Masquerading forward rules (disabled — uncomment and set interface names to enable)
        # iifname "<WAN_IFACE>" oifname "<LAN_IFACE>" ct state established,related accept
        # iifname "<LAN_IFACE>" oifname "<WAN_IFACE>" accept
    }

    chain output {
        type filter hook output priority filter; policy accept;
    }
}